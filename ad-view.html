<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعلان</title><style>body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#111}.wrap{max-width:760px;margin:auto;padding:16px}.back{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0001}.title{font-size:24px;font-weight:700;margin:0 0 12px}.body{font-size:17px;line-height:1.8;white-space:pre-wrap}.img{display:block;width:100%;max-height:65vh;object-fit:contain;border-radius:12px;margin:0 0 16px}.muted{text-align:center;color:#777;padding:30px}</style></head><body><main class="wrap"><button class="back" onclick="goBack()">← رجوع إلى الموقع</button><section id="ad" class="card"><div class="muted">جاري تحميل الإعلان…</div></section></main><script>const SUPABASE_URL="https://ovocwugezuddbwypzteg.supabase.co";const SUPABASE_KEY="sb_publishable_THEl1NqFWWRUImYpTLxu9g_iGM03Nsz";const qs=new URLSearchParams(location.search);const adId=qs.get("ad_id");function goBack(){if(history.length>1)history.back();else location.href=new URL("./",location.href).href;}async function load(){const box=document.getElementById("ad");try{let url=SUPABASE_URL+"/rest/v1/ads?select=*&active=eq.true&order=created_at.desc&limit=1";if(adId)url=SUPABASE_URL+"/rest/v1/ads?select=*&id=eq."+encodeURIComponent(adId)+"&limit=1";const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});const rows=await r.json();const a=Array.isArray(rows)?rows[0]:null;if(!a)throw Error("لا يوجد إعلان");box.innerHTML=(a.image_url?'<img class="img" src="'+esc(a.image_url)+'">':'')+'<h1 class="title">'+esc(a.title||"إعلان")+'</h1><div class="body">'+esc(a.body||a.description||"")+'</div>';}catch(e){box.innerHTML='<div class="muted">تعذر تحميل الإعلان.</div>';}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load();</script></body></html>
