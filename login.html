<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - سعرلي سوريا</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#080d11;
  color:#f1f4f5;
  font-family:Arial,Tahoma,sans-serif;
}
.box{
  max-width:420px;
  margin:70px auto;
  padding:25px;
}
h1{
  color:#35d07f;
  text-align:center;
}
.card{
  background:#12191d;
  padding:25px;
  border-radius:18px;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #303b40;
  font-size:16px;
}
input{
  background:#0b1115;
  color:white;
}
button{
  background:#35d07f;
  color:#06100a;
  font-weight:bold;
  border:0;
}
#msg{
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <h1>سعرلي سوريا</h1>

  <div class="card">
    <h2>تسجيل الدخول</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button onclick="login()">تسجيل الدخول</button>

    <div id="msg"></div>
  </div>
</div>

<script>

const SUPABASE_URL = "https://kymecgtzquboepdpyrw.supabase.co";

/*
ضع هنا الـ Publishable key الذي نسخته من Supabase
ولا تضع Secret key
*/
const SUPABASE_KEY = "ضع_المفتاح_هنا";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("msg");

  if(!email || !password){
    msg.textContent = "اكتب البريد وكلمة المرور";
    return;
  }

  msg.textContent = "جاري تسجيل الدخول...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    msg.textContent = "خطأ: " + error.message;
    return;
  }

  msg.textContent = "تم تسجيل الدخول بنجاح ✅";

  setTimeout(() => {
    window.location.href = "index.html";
  }, 1000);
}

</script>

</body>
</html>
const SUPABASE_KEY = "sb_publishable_wCEKoFFXqrhkE9cBWQwMGg_2OWs_jnS";
